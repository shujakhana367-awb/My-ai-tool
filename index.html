<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUJA FLOW - Final Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:15px}
.container{width:100%;max-width:480px}
.header{text-align:center;margin:15px 0}
.header h1{font-size:30px;background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:20px}
textarea{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:15px;color:#fff;outline:none;font-size:15px;resize:none}
select,input{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;outline:none;margin-top:12px;font-size:14px}
.btn{width:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border:none;border-radius:12px;padding:15px;color:#fff;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer}
.btn2{width:100%;background:#222;border:1px solid #444;border-radius:12px;padding:10px;color:#aaa;font-size:13px;margin-top:8px;cursor:pointer}
.preview{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:20px;min-height:200px;text-align:center;margin-top:15px}
.status{color:#a855f7;margin:10px 0;font-size:14px}
video{width:100%;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>SHUJA FLOW</h1><p style="color:#666;font-size:12px">Fixed Version | Chrome me kholo</p></div>
<div class="card">
<textarea id="prompt" rows="3">A cinematic shot of a lion walking in the desert, golden hour, 8k</textarea>
<select><option>8s Duration</option></select>
<select><option>9:16 Vertical</option></select>
<input type="password" id="apikey" placeholder="HF Key yahan paste karo (hf_...)">
<button class="btn" id="genBtn" onclick="generate()">Generate Video ▶</button>
<button class="btn2" onclick="testKey()">🔑 Key Check Karo</button>
</div>
<div class="preview"><div id="status"></div><div id="output"><p style="color:#555;margin-top:30px">Video yahan ayegi... Chrome me kholo zaruri hai.</p></div></div>
</div>
<script>
const saved = localStorage.getItem('shuja_hf_key_final');
if(saved) document.getElementById('apikey').value = saved;
async function testKey(){
 const k = document.getElementById('apikey').value.trim();
 const s = document.getElementById('status');
 s.innerHTML='Checking...';
 try{
  const r = await fetch('https://huggingface.co/api/whoami-v2',{headers:{'Authorization':'Bearer '+k}});
  if(r.ok){ s.innerHTML='<div style="color:#4ade80">✅ Key Theek Hai!</div>'; }
  else{ s.innerHTML='❌ Key galat hai'; }
 }catch(e){ s.innerHTML='Chrome me kholo: '+e.message; }
}
async function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 const key=document.getElementById('apikey').value.trim();
 const btn=document.getElementById('genBtn');
 const statusDiv=document.getElementById('status');
 const outputDiv=document.getElementById('output');
 if(!key.startsWith('hf_')){ alert('HF Key paste karo!'); return; }
 localStorage.setItem('shuja_hf_key_final', key);
 btn.disabled=true; btn.innerText='⏳ Loading...';
 statusDiv.innerHTML='⏳ Model jag raha hai 30 sec...';
 const MODEL="ali-vilab/text-to-video-ms-1.7b";
 const URL=`https://router.huggingface.co/hf-inference/models/${MODEL}`;
 try{
  const res = await fetch(URL,{method:'POST',headers:{'Authorization':`Bearer ${key}`,'Content-Type':'application/json','x-wait-for-model':'true'},body:JSON.stringify({inputs:prompt})});
  if(!res.ok){ const t=await res.text(); throw new Error(t.substring(0,200)); }
  const blob=await res.blob();
  const videoUrl=URL.createObjectURL(blob);
  statusDiv.innerHTML='<div style="color:#4ade80">✅ Video Ban Gayi!</div>';
  outputDiv.innerHTML=`<video controls autoplay loop src="${videoUrl}"></video><br><a href="${videoUrl}" download="shuja-flow.mp4" class="btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none">⬇️ Download</a>`;
 }catch(e){
  statusDiv.innerHTML=`❌ ${e.message}<br><small>Tip: Chrome me kholo, WhatsApp browser block karta hai</small>`;
 }
 btn.disabled=false; btn.innerText='Generate Video ▶';
}
</script>
</body>
</html>
