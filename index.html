
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shuja AI Studio</title>
<style>body{background:#0f0f0f;color:white;font-family:sans-serif;margin:0}.header{background:linear-gradient(90deg,#9333ea,#ec4899);padding:20px;text-align:center}.box{background:#1f1f1f;margin:15px;padding:15px;border-radius:15px}textarea{width:100%;background:#000;color:white;border:1px solid #444;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}button{width:100%;background:linear-gradient(90deg,#9333ea,#ec4899);color:white;border:none;padding:15px;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}#result img{width:100%;border-radius:15px;margin-top:10px}</style></head>
<body><div class="header"><h1>🚀 Shuja AI Studio</h1><p>by Shuja</p></div>
<div class="box"><h3>🖼️ Text to Image</h3><textarea id="prompt" rows="3" placeholder="Jaise: A lion in Thar desert"></textarea><button onclick="generate()">Generate Image ✨</button><div id="result"></div></div>
<script>function generate(){let p=document.getElementById('prompt').value;if(!p){alert('Kuch likho!');return;}document.getElementById('result').innerHTML='⏳ 5 second...';let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?seed='+Math.random();document.getElementById('result').innerHTML='<img src="'+url+'"><br><br><a href="'+url+'" target=_blank style=color:#ec4899>📥 Download</a>';}</script></body></html>
