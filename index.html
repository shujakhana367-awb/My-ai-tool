
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shuja AI Studio</title><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;margin:0}.header{background:linear-gradient(90deg,#9333ea,#ec4899);padding:20px;text-align:center}.box{background:#1a1a1a;margin:15px;padding:15px;border-radius:15px;border:1px solid #333}textarea,input{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;box-sizing:border-box}button{width:100%;background:linear-gradient(90deg,#9333ea,#ec4899);color:#fff;border:none;padding:14px;border-radius:10px;font-weight:bold;margin-top:10px;font-size:16px}.tab{display:flex;gap:10px;margin-bottom:10px}.tab button{flex:1;background:#333}.tab button.active{background:linear-gradient(90deg,#9333ea,#ec4899)}#result img, #result video{width:100%;border-radius:10px;margin-top:10px}</style></head><body><div class="header"><h1>🚀 Shuja AI Studio</h1><p>by Shuja - All in One</p></div><div class="box"><div class="tab"><button class="active" onclick="showTab(1)" id="t1">Image</button><button onclick="showTab(2)" id="t2">Video</button></div><div id="tab1"><textarea id="prompt" rows="3" placeholder="A lion in desert..."></textarea><button onclick="genImg()">Generate Image ✨</button></div><div id="tab2" style="display:none"><textarea id="vprompt" rows="2" placeholder="Video prompt..."></textarea><input type="file" id="imgInput" accept="image/*" style="margin-top:10px"><button onclick="genVideo()">Generate Video 🎬 (Demo)</button><p style="font-size:12px;color:#aaa">Note: Free video AI requires API key, ye demo link hai</p></div><div id="result"></div></div><script>function showTab(n){document.getElementById('tab1').style.display=n==1?'block':'none';document.getElementById('tab2').style.display=n==2?'block':'none';document.getElementById('t1').className=n==1?'active':'';document.getElementById('t2').className=n==2?'active':'';}function genImg(){let p=document.getElementById('prompt').value;if(!p)return alert('Prompt likho');document.getElementById('result').innerHTML='⏳ Generating...';let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?seed='+Math.random();document.getElementById('result').innerHTML='<img src="'+url+'"><br><a href="'+url+'" target="_blank" style="color:#ec4899">📥 Download Image</a>';}function genVideo(){let p=document.getElementById('vprompt').value||'cinematic';document.getElementById('result').innerHTML='Video AI ke liye API lagti hai, filhal aap image se video ke liye <b>RunwayML / Pika</b> use karo. Aapka prompt: '+p;}</script></body></html>
